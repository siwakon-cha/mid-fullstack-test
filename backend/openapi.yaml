openapi: 3.1.0
info:
  title: จองตั๋ว Event Booking API
  version: 1.0.0
  description: REST API for registration, events, bookings, cancellation, and event administration.
  license: { name: MIT }
servers:
  - url: /
    description: Same-origin Next.js proxy
security: []
tags:
  - { name: Auth, description: Registration and JWT cookie session }
  - { name: Events, description: Public event discovery }
  - { name: Bookings, description: Authenticated booking lifecycle }
  - { name: Admin, description: Role-1 event administration }
paths:
  /health:
    get:
      operationId: health
      summary: Backend/database readiness
      responses:
        "200": { description: Ready, content: { application/json: { schema: { $ref: "#/components/schemas/Health" } } } }
        "503": { description: Database unavailable }
        "400": { description: Invalid request }
  /api/auth/register:
    post:
      operationId: register
      tags: [Auth]
      summary: Register a role-2 user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterInput" }
      responses:
        "201": { description: Registered, content: { application/json: { schema: { $ref: "#/components/schemas/UserResponse" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/auth/login:
    post:
      operationId: login
      tags: [Auth]
      summary: Login and set the event_session HttpOnly cookie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200":
          description: Logged in
          headers:
            Set-Cookie: { schema: { type: string }, description: HttpOnly SameSite=Lax JWT cookie }
          content: { application/json: { schema: { $ref: "#/components/schemas/UserResponse" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/auth/logout:
    post:
      operationId: logout
      tags: [Auth]
      security: [{ cookieAuth: [] }]
      summary: Clear the browser session cookie
      responses:
        "200": { description: Logged out }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/auth/me:
    get:
      operationId: me
      tags: [Auth]
      security: [{ cookieAuth: [] }]
      summary: Current user profile
      responses:
        "200": { description: Profile, content: { application/json: { schema: { $ref: "#/components/schemas/UserResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/events:
    get:
      operationId: listEvents
      tags: [Events]
      summary: Upcoming events with prefix search and pagination
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
        - { name: search, in: query, schema: { type: string, maxLength: 80 } }
      responses:
        "200": { description: Event page (Redis cache-aside), content: { application/json: { schema: { $ref: "#/components/schemas/EventList" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/events/{id}:
    get:
      operationId: getEvent
      tags: [Events]
      summary: Event detail read directly from PostgreSQL
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { description: Event, content: { application/json: { schema: { type: object, properties: { event: { $ref: "#/components/schemas/Event" } } } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/events/{id}/bookings:
    post:
      operationId: createBooking
      tags: [Bookings]
      security: [{ cookieAuth: [] }]
      summary: Add 1–4 seats atomically, with at most 4 active seats per user and event
      description: Repeated requests add to the existing confirmed booking. A request that would make the cumulative quantity exceed 4 is rejected and fully rolled back.
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties: { quantity: { type: integer, minimum: 1, maximum: 4 } }
      responses:
        "201": { description: Booking confirmed; the response quantity is the cumulative active quantity }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/bookings/me:
    get:
      operationId: listMyBookings
      tags: [Bookings]
      security: [{ cookieAuth: [] }]
      summary: Current user's bookings
      responses:
        "200":
          description: Booking list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Booking" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/bookings/{id}:
    delete:
      operationId: cancelBooking
      tags: [Bookings]
      security: [{ cookieAuth: [] }]
      summary: Cancel an owned confirmed booking and return seats once
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { description: Cancelled }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/admin/events:
    post:
      operationId: createEvent
      tags: [Admin]
      security: [{ cookieAuth: [] }]
      summary: Create an event (role 1 only)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/EventInput" } } }
      responses:
        "201": { description: Created }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/admin/events/{id}:
    patch:
      operationId: updateEvent
      tags: [Admin]
      security: [{ cookieAuth: [] }]
      summary: Edit an event without reducing capacity below confirmed seats
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/EventInput" } } }
      responses:
        "200": { description: Updated }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: event_session
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
  responses:
    BadRequest: { description: Invalid request, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Unauthorized: { description: Login required, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Forbidden: { description: Origin or role/ownership denied, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    NotFound: { description: Resource not found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Conflict: { description: State conflict, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  schemas:
    Health:
      type: object
      required: [status]
      properties: { status: { type: string, example: ok } }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: SOLD_OUT }
            message: { type: string, example: ที่นั่งไม่เพียงพอ }
    RegisterInput:
      type: object
      required: [first_name, last_name, email, password]
      properties:
        first_name: { type: string, minLength: 1, maxLength: 100 }
        last_name: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 72, format: password }
        phone: { type: [string, "null"], maxLength: 20 }
    User:
      type: object
      required: [id, first_name, last_name, email, role]
      properties:
        id: { type: integer, format: int64 }
        first_name: { type: string }
        last_name: { type: string }
        email: { type: string, format: email }
        phone: { type: [string, "null"] }
        role: { type: integer, enum: [1, 2] }
    UserResponse:
      type: object
      properties: { user: { $ref: "#/components/schemas/User" } }
    EventInput:
      type: object
      required: [title, description, location, starts_at, total_seats]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string }
        location: { type: string, maxLength: 255 }
        starts_at: { type: string, format: date-time }
        total_seats: { type: integer, minimum: 1 }
    Event:
      allOf:
        - { $ref: "#/components/schemas/EventInput" }
        - type: object
          required: [id, available_seats]
          properties:
            id: { type: integer, format: int64 }
            available_seats: { type: integer, minimum: 0 }
    EventList:
      type: object
      required: [items, page, page_size, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Event" } }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer, format: int64 }
    Booking:
      type: object
      properties:
        id: { type: integer, format: int64 }
        event_id: { type: integer, format: int64 }
        quantity: { type: integer, minimum: 1, maximum: 4 }
        status: { type: integer, enum: [1, 2] }
        cancelled_at: { type: [string, "null"], format: date-time }
        event_title: { type: string }
        event_starts_at: { type: string, format: date-time }
        event_location: { type: string }

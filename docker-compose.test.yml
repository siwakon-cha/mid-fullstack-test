services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: event_booking_test
      POSTGRES_USER: event_test
      POSTGRES_PASSWORD: event_test_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U event_test -d event_booking_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data

  redis-test:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend-tests:
    build:
      context: ./backend
      target: test
    environment:
      APP_ENV: test
      TEST_DATABASE_URL: postgres://event_test:event_test_password@postgres-test:5432/event_booking_test?sslmode=disable
      TEST_REDIS_URL: redis://redis-test:6379/1
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    command: ["go", "test", "-tags=integration", "./...", "-count=1", "-v"]
